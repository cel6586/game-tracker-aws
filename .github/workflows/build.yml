name: Build and push images

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: pip install -r requirements-dev.txt
        working-directory: api

      - run: pytest
        working-directory: api

      - run: ruff check .
        working-directory: api

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  build:
    needs: [test, secret-scan]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::000978831369:role/github-ecr-push
          aws-region: us-east-2

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # builds image and does a trivy check
      - uses: docker/build-push-action@v7
        with:
          context: ./api
          load: true
          tags: ${{ steps.ecr.outputs.registry }}/game-tracker-api:${{ github.sha }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/game-tracker-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - uses: docker/build-push-action@v7
        with:
          context: ./web
          load: true
          tags: ${{ steps.ecr.outputs.registry }}/game-tracker-web:${{ github.sha }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/game-tracker-web:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      # Pushes image
      - uses: docker/build-push-action@v7
        with:
          context: ./api
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/game-tracker-api:${{ github.sha }}
      - uses: docker/build-push-action@v7
        with:
          context: ./web
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/game-tracker-web:${{ github.sha }}
